<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Recall Closer project starter page">
    <title>Recall Closer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #182230;
        background: #f4f7fb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 38rem;
        margin: 1.5rem;
        padding: 2.5rem;
        border: 1px solid #dbe3ee;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 2.5rem rgb(24 34 48 / 8%);
      }

      h1 {
        margin-top: 0;
        color: #174ea6;
      }

      p {
        line-height: 1.6;
      }

      .status {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        color: #185c37;
        background: #e7f5ec;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="status">Starter scaffold</span>
      <h1>Recall Closer</h1>
      <p>
        The project foundation is in place. Product features and integrations
        will be added as development gets underway.
      </p>
    </main>
  </body>
</html>
